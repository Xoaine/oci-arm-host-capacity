name: OCI Auto Provision

on:
  schedule:
    # Tự động chạy định kỳ
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-capacity-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Private Key
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Run Provisioning Loop
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME: /home/runner/.oci/oci_api_key.pem
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_SHAPE: VM.Standard.A1.Flex
          OCI_MAX_INSTANCES: 1
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_BOT_API_KEY: ${{ secrets.TELEGRAM_BOT_API_KEY }}
        run: |
          echo "🚀 Bắt đầu phiên quét liên tục 15 phút..."
          END_TIME=$((SECONDS + 900))
          COUNT=1

          while [ $SECONDS -lt $END_TIME ]; do
            echo "=========================================="
            echo "--- Lượt quét #$COUNT lúc $(date '+%H:%M:%S') ---"
            
            OUTPUT=$(php index.php)
            echo "$OUTPUT"

            # Kiểm tra nếu tạo thành công hoặc đã có máy tồn tại
            if echo "$OUTPUT" | grep -qi -E '"lifecycleState":\s*"(PROVISIONING|RUNNING)"|Already has'; then
              echo "🎉 ĐÃ TẠO MÁY ẢO THÀNH CÔNG! DỪNG VÒNG LẶP."
              exit 0
            fi

            COUNT=$((COUNT + 1))
            echo "Chờ 25 giây cho lượt tiếp theo..."
            sleep 25
          done
          echo "Hoàn thành phiên 15 phút."
